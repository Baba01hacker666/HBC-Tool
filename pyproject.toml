[tool.poetry]
name = "hbctool-cli"
version = "0.18"
description = "A command-line interface for disassembling and assembling the Hermes Bytecode."
authors = ["baba01hacker"]
keywords = ["hbc", "hermes", "bytecode", "reverse", "hacking"]
classifiers = [
    'Development Status :: 3 - Alpha',
    'Natural Language :: English',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.8',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Baba01hacker666/HBC-Tool"
repository = "https://github.com/Baba01hacker666/HBC-Tool"
documentation = "https://github.com/Baba01hacker666/HBC-Tool"

[tool.poetry.dependencies]
python = ">=3.8"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.poetry.scripts]
hbctool = "hbctool:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Generated per-version modules: star-import shared util helpers and use
# short identifiers copied from the Hermes C++ source they mirror.
"hbctool/hbc/hbc*/**" = ["F403", "F405", "E741"]